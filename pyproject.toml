[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-research-engine"
version = "0.1.0"
description = "Internal YouTube research tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "youtube-transcript-api",
  "openai",
  "requests",
  "flask",
  "duckdb",
  "yt-dlp",
  "sentence-transformers",
  "keybert",
  "bertopic",
  "streamlit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
